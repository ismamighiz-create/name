name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompresser le projet
        run: |
          unzip -q ./*.zip
          D=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n' > "$D/gradle.properties"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compiler
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MaSerie-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
