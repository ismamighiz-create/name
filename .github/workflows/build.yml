name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Décompresser le projet
        run: |
          git ls-files '*.zip' | while IFS= read -r f; do
            echo "$(git log -1 --format=%ct -- "$f")|$f"
          done | sort -n | cut -d'|' -f2- | while IFS= read -r z; do
            echo "Décompression de $z"
            unzip -qo "$z"
          done
          D=$(dirname "$(find . -name settings.gradle.kts | head -1)")
          echo "PROJ=$D" >> $GITHUB_ENV
          printf 'android.useAndroidX=true\norg.gradle.jvmargs=-Xmx3g\n' > "$D/gradle.properties"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accepter les licences Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Compiler
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MaSerie-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/debug/app-debug.apk
